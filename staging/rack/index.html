<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CONTOUR — The rack (staging)</title>
<link rel="icon" href="../../favicon.svg">
<link rel="stylesheet" href="../../contour-fonts.css">
<style>
  :root{--bone:#EFE9DC;--ink:#0b0c0e;--orange:#E8642C;--mute:#8a8a86}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);color:var(--bone);overflow:hidden;
    font-family:"Geist","IBM Plex Mono",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
  .mono{font-family:"IBM Plex Mono","Geist Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 28px;pointer-events:none;z-index:3}
  header a{pointer-events:auto;color:var(--bone);text-decoration:none}
  .brand{font-family:"Anton","Geist",sans-serif;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
  .label{position:fixed;left:0;right:0;bottom:44px;text-align:center;z-index:3;pointer-events:none}
  .label .count{color:var(--mute)}
  .label h2{font-family:"Anton","Geist",sans-serif;font-weight:400;font-size:clamp(34px,6vw,64px);letter-spacing:.02em;text-transform:uppercase;line-height:1;margin:10px 0 8px;transition:opacity .18s,transform .18s}
  .label.swap h2,.label.swap .sub{opacity:0;transform:translateY(6px)}
  .label .sub{transition:opacity .18s,transform .18s}
  .label .sub b{color:var(--orange);font-weight:400}
  .controls{position:fixed;bottom:40px;left:28px;right:28px;display:flex;justify-content:space-between;z-index:4;pointer-events:none}
  .controls button{pointer-events:auto;background:none;border:1px solid rgba(239,233,220,.35);color:var(--bone);width:46px;height:46px;border-radius:50%;font-size:18px;cursor:pointer;transition:border-color .2s,background .2s}
  .controls button:hover{border-color:var(--bone);background:rgba(239,233,220,.06)}
  .hint{position:fixed;top:50%;right:28px;writing-mode:vertical-rl;color:var(--mute);z-index:3;pointer-events:none}
  .coord{position:fixed;top:50%;left:28px;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--mute);z-index:3;pointer-events:none}
  .fallback{display:none;position:fixed;inset:0;overflow:auto;padding:90px 20px 40px;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .nogl .fallback{display:grid}.nogl canvas,.nogl .controls,.nogl .hint{display:none}
  .fallback img{width:100%;height:auto}
  @media (max-width:640px){.hint,.coord{display:none}.controls{bottom:110px}.label{bottom:30px}header{padding:18px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<header><a class="brand" href="../">Contour</a><span class="mono">Expedition 01 — The rack</span></header>
<div class="coord mono">Rack 01 · 52.52°N 13.40°E</div>
<div class="hint mono">Drag to spin · Tap to turn</div>
<div class="label" id="label">
  <div class="count mono" id="count">01 / 04</div>
  <h2 id="name">Contour 01</h2>
  <div class="sub mono" id="sub">Bone · <b>Front</b></div>
</div>
<div class="controls"><button id="prev" aria-label="Previous">←</button><button id="next" aria-label="Next">→</button></div>
<div class="fallback" id="fallback"></div>

<script type="module">
import * as THREE from 'three';

const ITEMS = [
  { id:'bone',  name:'Contour 01',        colour:'Bone',       back:'Keep climbing' },
  { id:'black', name:'Night Ascent',      colour:'Black',      back:'Every city has a summit' },
  { id:'night', name:'First Light',       colour:'Night navy', back:'First light' },
  { id:'green', name:'Unknown Territory', colour:'Forest',     back:'First light' },
];
const N = ITEMS.length, STEP = Math.PI*2/N, R = 2.35, H = 1.55;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
$('fallback').innerHTML = ITEMS.map(p => `<img src="${p.id}-front.webp" alt="${p.name} front"><img src="${p.id}-back.webp" alt="${p.name} back">`).join('');

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false }); }
catch(e){ document.documentElement.classList.add('nogl'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0b0c0e');
scene.fog = new THREE.Fog('#0b0c0e', 5.5, 10.5);
const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.1, 50);
function frame(){
  const portrait = innerWidth/innerHeight < 0.8;
  camera.position.set(0, 0.55, R + (portrait ? 5.6 : 3.9));
  camera.lookAt(0, -0.05, R*0.55);
}
frame();

// ---- studio reflection for the chrome ----
function studioEnv(){
  const s = new THREE.Scene(); s.background = new THREE.Color('#030303');
  const strip=(w,h,c,p)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color().setRGB(...c),side:THREE.DoubleSide}));m.position.set(...p);m.lookAt(0,0,0);s.add(m);};
  strip(6,2,[5,4.6,4.1],[0,5,0]); strip(.6,6,[3.2,3.4,3.8],[-5,.5,1.5]); strip(.45,6,[2.4,2.5,2.8],[5,.5,2.5]); strip(.5,4,[2.6,1,.35],[2.5,.5,-5]);
  const pm=new THREE.PMREMGenerator(renderer); const t=pm.fromScene(s,.015).texture; pm.dispose(); return t;
}
const steel = new THREE.MeshPhysicalMaterial({ color:'#ebe8e3', metalness:1, roughness:.14, clearcoat:.3, envMap:studioEnv() });

const RING_Y = 1.18;
const rack = new THREE.Group(); scene.add(rack);
const ring = new THREE.Mesh(new THREE.TorusGeometry(R,0.02,24,256), steel); ring.rotation.x=Math.PI/2; ring.position.y=RING_Y; rack.add(ring);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(.028,.028,20,32), steel); rack.add(pole);
const hub = new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.08,40), steel); hub.position.y=RING_Y; rack.add(hub);
for(let k=0;k<4;k++){ const a=k*Math.PI/2+Math.PI/4;
  const sp=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,R,16),steel); sp.rotation.z=Math.PI/2; sp.rotation.y=-a+Math.PI/2;
  sp.position.set(Math.sin(a)*R/2,RING_Y,Math.cos(a)*R/2); rack.add(sp); }

// floor glow
const floor = new THREE.Mesh(new THREE.CircleGeometry(4,64), new THREE.MeshStandardMaterial({color:'#111214',roughness:.95}));
floor.rotation.x=-Math.PI/2; floor.position.y=-1.15; scene.add(floor);

// ---- the tees ----
const loader = new THREE.TextureLoader();
const load = src => new Promise(r => loader.load(src, t => { t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; r(t); }));
function curved(w,h){
  const g=new THREE.PlaneGeometry(w,h,40,20); const p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i)/(w/2); p.setZ(i, -0.11*x*x + 0.03*Math.cos(p.getY(i)*3)); }
  g.computeVertexNormals(); return g;
}
const spin = new THREE.Group(); spin.position.y = 0; scene.add(spin);
const tees = [];
await Promise.all(ITEMS.map(async (p,i) => {
  const [f,b] = await Promise.all([load(`${p.id}-front.webp`), load(`${p.id}-back.webp`)]);
  const w = H * f.image.width / f.image.height;
  const mat = t => new THREE.MeshStandardMaterial({ map:t, transparent:true, alphaTest:.35, roughness:.85, metalness:0, side:THREE.FrontSide });
  const g = curved(w, H);
  const tee = new THREE.Group();
  const front = new THREE.Mesh(g, mat(f));
  const wb = H * b.image.width / b.image.height;
  const back = new THREE.Mesh(curved(wb, H), mat(b)); back.rotation.y = Math.PI; back.position.z = -0.002;
  tee.add(front, back);
  // hook: from ring down to collar
  const hook = new THREE.Mesh(new THREE.CylinderGeometry(.007,.007,RING_Y-H/2+0.02,10), steel);
  hook.position.y = (RING_Y + H/2)/2 - 0.0; 
  const pivot = new THREE.Group(); pivot.position.y = RING_Y;   // swings from the ring
  tee.position.y = -RING_Y; pivot.add(tee);
  const mount = new THREE.Group(); const a = i*STEP;
  mount.position.set(Math.sin(a)*R, 0, Math.cos(a)*R); mount.rotation.y = a;
  hook.position.set(0,(RING_Y+H/2)/2,0); mount.add(hook, pivot); spin.add(mount);
  front.userData.i = back.userData.i = i;
  tees[i] = { p, mount, pivot, tee, front, back, yaw:0, yawGoal:0, yawV:0, sw:0, swV:0, glow:0 };
}));

// ---- light ----
scene.add(new THREE.AmbientLight('#c9cfd8', .35));
const key = new THREE.SpotLight('#ffe8cf', 70, 12, .32, .65, 1.2);
key.position.set(0, 3.4, R+2.6); key.target.position.set(0, -.1, R); scene.add(key, key.target);
const rim = new THREE.PointLight('#E8642C', 6, 6, 1.6); rim.position.set(-2.4, 1, R-1.6); scene.add(rim);
const fill = new THREE.DirectionalLight('#9fb0c8', .25); fill.position.set(3,2,4); scene.add(fill);

// ---- state & input ----
let angle=0, goal=0, vel=0, dragging=false, lastX=0, moved=0, downAt=0, lastInput=performance.now();
const frontIndex = () => ((Math.round(-goal/STEP) % N) + N) % N;
const goTo = i => { const t=-i*STEP; const k=Math.round((goal-t)/(Math.PI*2)); goal=t+k*Math.PI*2; };
let shown=-1, shownSide='';
function label(){
  const i=frontIndex(), t=tees[i]; if(!t) return;
  const side = Math.round(t.yawGoal/Math.PI)%2 ? 'Back' : 'Front';
  if(i===shown && side===shownSide) return;
  const L=$('label'); const changeName = i!==shown; shown=i; shownSide=side;
  if(changeName) L.classList.add('swap');
  setTimeout(()=>{
    $('count').textContent = `${String(i+1).padStart(2,'0')} / ${String(N).padStart(2,'0')}`;
    $('name').textContent = t.p.name;
    $('sub').innerHTML = side==='Back' ? `${t.p.colour} · <b>Back</b> · “${t.p.back}”` : `${t.p.colour} · <b>Front</b>`;
    L.classList.remove('swap');
  }, changeName?180:0);
}
function turn(i){ const t=tees[i]; t.yawGoal += Math.PI; t.swV += .6; label(); }
function stepBy(d){ tees[frontIndex()].yawGoal = Math.round(tees[frontIndex()].yawGoal/(2*Math.PI))*2*Math.PI; goTo(frontIndex()+d); kick(d); lastInput=performance.now(); }
function kick(d){ tees.forEach(t=>t.swV -= d*.5); }
$('prev').onclick=()=>stepBy(-1); $('next').onclick=()=>stepBy(1);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight')stepBy(1); if(e.key==='ArrowLeft')stepBy(-1); if(e.key===' '||e.key==='Enter'){e.preventDefault();turn(frontIndex());} });

const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{ dragging=true; lastX=e.clientX; moved=0; downAt=performance.now(); canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; const dx=e.clientX-lastX; lastX=e.clientX; moved+=Math.abs(dx);
  const d = dx/innerWidth*3.2; goal+=d; vel=d; tees.forEach(t=>t.swV -= d*1.4); lastInput=performance.now(); });
canvas.addEventListener('pointerup',e=>{ dragging=false; canvas.classList.remove('drag');
  if(moved<6){ ptr.set(e.clientX/innerWidth*2-1, -e.clientY/innerHeight*2+1); ray.setFromCamera(ptr,camera);
    const hit=ray.intersectObjects(tees.flatMap(t=>[t.front,t.back]),false)[0];
    if(hit){ const i=hit.object.userData.i; if(i===frontIndex()) turn(i); else { goTo(i); kick(1); } }
  } else { goal += vel*6; goTo(frontIndex()); }
  lastInput=performance.now(); label(); });
let wheelAt=0;
addEventListener('wheel',e=>{ e.preventDefault(); const now=performance.now(); if(now-wheelAt<420) return;
  const d = Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY; if(Math.abs(d)<4) return; wheelAt=now; stepBy(d>0?1:-1); },{passive:false});

addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); frame(); });

// ---- loop ----
const clock=new THREE.Clock();
label();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(!dragging && !reduced && performance.now()-lastInput>7000){ goal -= dt*0.12; if(performance.now()-lastInput>7000+ (STEP/0.12)*1000){ goTo(frontIndex()); lastInput=performance.now()-3000; } }
  angle += (goal-angle)*(1-Math.exp(-dt*(dragging?18:5)));
  spin.rotation.y = angle;
  const fi=frontIndex(); label();
  tees.forEach((tt,i)=>{
    // turn spring
    tt.yawV += (tt.yawGoal-tt.yaw)*60*dt; tt.yawV *= Math.exp(-dt*9); tt.yaw += tt.yawV*dt;
    tt.tee.rotation.y = tt.yaw;
    // swing on hook
    tt.swV += -tt.sw*40*dt; tt.swV *= Math.exp(-dt*2.2); tt.sw += tt.swV*dt;
    tt.pivot.rotation.z = tt.sw*.12 + (reduced?0:Math.sin(t*.9+i)*.006);
    tt.pivot.rotation.x = reduced?0:Math.sin(t*.7+i*2)*.008;
    // the front one comes forward a touch
    const target = i===fi ? 1 : 0; tt.glow += (target-tt.glow)*(1-Math.exp(-dt*4));
    tt.pivot.position.z = tt.glow*.18;
    const m=0.45+0.55*tt.glow; tt.front.material.color.setScalar(m); tt.back.material.color.setScalar(m);
  });
  renderer.render(scene,camera);
});
</script>
</body>
</html>
